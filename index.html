<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#12161f">
  <title>Фаза — головоломка по электрике</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <span id="level-title">Уровень 1</span>
      <span id="hint-text"></span>
    </header>

    <canvas id="board"></canvas>

    <div id="status" class="status"></div>

    <div id="controls">
      <button id="btn-check" class="primary">Проверить</button>
      <button id="btn-undo">Отменить</button>
      <button id="btn-reset">Сброс</button>
      <button id="btn-hint">Подсказка</button>
    </div>

    <div id="overlay" class="hidden">
      <div id="overlay-box">
        <h2 id="overlay-title"></h2>
        <p id="overlay-text"></p>
        <button id="overlay-btn" class="primary">Далее</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
